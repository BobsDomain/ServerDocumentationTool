name: build

# Every push and pull request: build the app (one native exe), run the unit tests, install the DNS, DHCP and IIS roles
# as test fixtures, run the app's self-test (a real collection of the runner through the app's own code path), and
# package ServerDocumentationTool.exe with its SHA256 file (download them from the run's Artifacts).
# Pushing a tag such as v2.0.0 also publishes a GitHub Release, which the app's update button installs.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content VERSION.txt -Raw).Trim()
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "VERSION.txt must contain a version like 2.0.0 (found '$v')" }
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $t = $env:GITHUB_REF_NAME.TrimStart('v')
            if ($t -ne $v) { throw "Tag $($env:GITHUB_REF_NAME) does not match VERSION.txt ($v)" }
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v"

      - name: Build app and unit tests
        shell: pwsh
        run: |
          dotnet build src/ServerDocumentationTool/ServerDocumentationTool.csproj -c Release -p:Version=${{ steps.ver.outputs.version }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/UnitTests/UnitTests.csproj -c Release -p:Version=${{ steps.ver.outputs.version }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Unit tests
        shell: pwsh
        run: |
          $fx = Join-Path $env:RUNNER_TEMP 'fixtures'
          Copy-Item tests/UnitTests/fixtures $fx -Recurse -Force
          & tests/UnitTests/bin/Release/net48/UnitTests.exe $fx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install DNS, DHCP and IIS roles (test fixtures for the role collectors)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Install-WindowsFeature DNS, DHCP, Web-Server -IncludeManagementTools | Format-Table Success, RestartNeeded, FeatureResult -AutoSize | Out-String | Write-Host
          Start-Service DNS
          Add-DnsServerPrimaryZone -Name 'ci.test' -ZoneFile 'ci.test.dns'
          Set-DnsServerForwarder -IPAddress 192.0.2.53
          Start-Service DHCPServer
          Add-DhcpServerv4Scope -Name 'CI Scope' -StartRange 192.0.2.10 -EndRange 192.0.2.50 -SubnetMask 255.255.255.0 -State Active
          Get-DnsServerZone | Format-Table ZoneName, ZoneType -AutoSize | Out-String | Write-Host
          Get-DhcpServerv4Scope | Format-Table ScopeId, Name, StartRange, EndRange, State -AutoSize | Out-String | Write-Host
          Get-Service W3SVC | Format-Table Name, Status -AutoSize | Out-String | Write-Host

      - name: App self-test (real local collection through the app, role collectors checked)
        shell: pwsh
        run: |
          $exe = 'src/ServerDocumentationTool/bin/Release/net48/ServerDocumentationTool.exe'
          $out = Join-Path $env:RUNNER_TEMP 'AppSelfTest'
          $a = @('--selftest', ('"' + $out + '"'),
                 '--expect', '"role=DNS Server"', '--expect', 'dns-zone=ci.test', '--expect', 'dns-forwarder=192.0.2.53',
                 '--expect', '"role=DHCP Server"', '--expect', 'dhcp-scope=192.0.2.0',
                 '--expect', '"role=IIS Server"', '--expect', '"iis-site=Default Web Site"')
          $p = Start-Process -FilePath $exe -ArgumentList $a -Wait -PassThru
          if (Test-Path (Join-Path $out 'selftest.log')) { Get-Content (Join-Path $out 'selftest.log') } else { Write-Host 'selftest.log was not written' }
          Write-Host "Self-test exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Upload self-test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-output
          path: ${{ runner.temp }}/AppSelfTest

      - name: Package
        shell: pwsh
        run: ./build/Package.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ServerDocumentationTool_v${{ steps.ver.outputs.version }}
          path: dist/*

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $exe = 'dist/ServerDocumentationTool.exe'
          $notes = "Docs/v$v-ReleaseNotes.md"
          if (Test-Path $notes) {
            gh release create $env:GITHUB_REF_NAME $exe "$exe.sha256" --title "Server Documentation Tool v$v" --notes-file $notes
          } else {
            gh release create $env:GITHUB_REF_NAME $exe "$exe.sha256" --title "Server Documentation Tool v$v" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
